name: Build PanVK (Android arm64)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar parches
        run: |
          if ls patches/*.patch >/dev/null 2>&1; then
            for p in patches/*.patch; do
              echo "Aplicando $p"
              git apply --verbose "$p"
            done
          else
            echo "Sin parches: se compila el codigo tal cual."
          fi

      - name: Instalar LLVM 21 (apt.llvm.org)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev libclang-21-dev libclang-cpp21-dev \
            libclc-21-dev clang-21 libzstd-dev
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"

      - name: Compilar SPIRV-LLVM-Translator 21
        run: |
          sudo apt-get install -y cmake ninja-build git
          git clone --depth 1 -b llvm_release_210 \
            https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git /tmp/spirv-tr || \
          git clone --depth 1 -b v21.1.0 \
            https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git /tmp/spirv-tr
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/spirv-headers
          cmake -S /tmp/spirv-tr -B /tmp/spirv-tr/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm \
            -DLLVM_EXTERNAL_SPIRV_HEADERS_SOURCE_DIR=/tmp/spirv-headers \
            -DLLVM_SPIRV_INCLUDE_TESTS=OFF
          ninja -C /tmp/spirv-tr/build
          sudo ninja -C /tmp/spirv-tr/build install
          sudo ldconfig

      - name: Instalar herramientas de compilacion
        run: |
          sudo apt-get install -y ninja-build pkg-config glslang-tools python3-pip \
            bison flex libexpat1-dev zlib1g-dev
          pip install --break-system-packages "meson>=1.4.0" mako packaging pyyaml

      - name: Instalar Android NDK r29
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Compilar
        run: ./build.sh "${{ steps.ndk.outputs.ndk-path }}"

      - name: Subir paquete
        uses: actions/upload-artifact@v4
        with:
          name: panvk-driver-${{ github.sha }}
          path: dist/
          if-no-files-found: error
